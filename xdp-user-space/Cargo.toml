[package]
name = "xdp-user-space"
version = "0.1.0"

[dependencies]
aya = { version = "0.3", features = ["async_tokio"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
xdp-data-structure = { path = "../xdp-data-structures" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
